/**:
  ros__parameters:
    # ---- 融合节点参数 ----

    # 传感器 frame ID（用于 TF 空间对齐）
    camera_frame: "oak_rgb_camera_optical_frame"
    laser_frame: "laser"
    radar_frame: "radar_link"
    target_frame: "base_link"

    # 时间同步窗口 (秒)
    time_window: 0.1

    # ---- 数据关联 ----
    # 欧氏距离门限 (米)
    association_gate: 3.0
    # 马氏距离阈值 (卡方分布, df=2, 95% = 5.991)
    mahalanobis_threshold: 5.991

    # ---- 目标管理 ----
    confirm_threshold: 3
    delete_threshold: 5
    max_tracks: 20

    # ---- Kalman Filter ----
    dt: 0.1
    # 过程噪声系数 (加速度方差, DWNA 模型)
    process_noise_q: 0.5

    # ---- 传感器噪声模型 (§5.5.1) ----
    # 视觉: σ²_cam = (σ²_c0 / conf) * exp(d² / (2*σ_c²))
    sigma_cam_0: 0.05        # 相机基准标准差 (1m, conf=1) [m]
    sigma_cam_scale: 5.0     # 相机距离衰减尺度 [m]
    # LiDAR: σ²_lidar = σ²_l0 * (N_ref / |C|)
    sigma_lidar_0: 0.03      # LiDAR 基准标准差 (N_ref=30点) [m]
    # 雷达: σ²_radar = σ²_r0 / (conf * (1 + α|v|/v₀))
    sigma_radar_0: 0.2       # 雷达基准标准差 (conf=1, v=0) [m]
    radar_vel_alpha: 0.5     # 雷达速度增益因子
    radar_vel_ref: 10.0      # 雷达参考速度 [m/s]

    # ---- 决策节点参数 ----
    # TTC 阈值 (秒)
    ttc_warning: 5.0
    ttc_slowdown: 3.0
    ttc_emergency: 1.0

    # 速度限制 (m/s, rad/s)
    max_linear_vel: 0.3
    slowdown_factor: 0.5
    max_angular_vel: 0.5
    min_safe_distance: 0.3

    # ---- 手柄控制 ----
    enable_joystick: true           # 启用手柄控制
    cooldown_seconds: 3.0           # 紧急恢复冷却时间 (秒)
    joy_topic: "/joy"
    joy_axis_linear: 1              # 左摇杆上下 → 线速度
    joy_axis_angular: 3             # 右摇杆左右 → 角速度
    joy_deadzone: 0.1               # 摇杆死区

    # ---- 传感器 Topic 重映射 ----
    detection_topic: "/detections"
    scan_topic: "/scan"
    radar_topic: "/radar_objects"
    tracked_objects_topic: "/tracked_objects"
    cmd_vel_topic: "/cmd_vel"

    # depthai-ros 发布 SpatialDetectionArray 的 topic
    depthai_detection_topic: "/oak/color/yolov4_Spatial_detections"
    depthai_depth_topic: "/stereo/depth"

    # ---- 串口桥接 (Jetson → STM32) ----
    serial_port: "/dev/ttyTHS2"
    serial_baud: 115200
    wheel_base: 0.2
    ticks_per_meter: 2000

    # ---- 雷达模拟器 (无真实毫米波雷达时使用) ----
    # 从 /tracked_objects 反算, 添加噪声后发布到 /radar_objects
    radar_sim_noise_position: 0.2       # 距离噪声标准差 (m)
    radar_sim_noise_velocity: 0.1       # 速度噪声标准差 (m/s)
    radar_sim_noise_bearing_deg: 2.0    # 方位角噪声标准差 (度)
